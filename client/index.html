<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CS Case Opening</title>
    <!-- Telegram Mini App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- Polyfills for older Android devices -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/es6-shim/0.35.6/es6-shim.min.js"></script>
    
    <script>
      window.startupLog = [];
      function log(msg) {
        console.log('[Init]', msg);
        window.startupLog.push(Date.now() + ': ' + msg);
      }
      log('Page started');
      window.addEventListener('load', function() { log('Window loaded'); });
      window.onerror = function(msg, url, line) { log('Global Error: ' + msg + ' at ' + url + ':' + line); };
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
