<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>CS Case Opening</title>

    <!-- Запрет жёсткого кэширования (Android WebView кэширует агрессивно) -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <!-- Подсказка браузеру: контент меняется при каждой загрузке -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <!-- Telegram Mini App SDK (загружаем первым — синхронно, он нужен до React) -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- Экстренный override базы API без пересборки: window.__MINIGAMES_API_BASE__ = 'https://ваш-туннель'; -->
    <script>
      window.startupLog = [];
      function log(msg) {
        console.log('[Init]', msg);
        window.startupLog.push(Date.now() + ': ' + msg);
      }
      log('Page started');
      window.addEventListener('load', function() { log('Window loaded'); });
      window.onerror = function(msg, url, line, col, err) {
        log('Error: ' + msg + ' at ' + url + ':' + line + ':' + col);
      };
      window.addEventListener('unhandledrejection', function(e) {
        log('UnhandledPromise: ' + (e.reason?.message || e.reason));
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
