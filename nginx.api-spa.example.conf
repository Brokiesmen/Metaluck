# Пример для nginx: запросы /api/* должны уходить на Node (Fastify :3001), а НЕ на try_files → index.html.
# Иначе браузер получит index.html вместо JSON → SyntaxError: Unexpected token '<'.
#
# Порядок location обязателен: сначала location /api/, затем статика, затем SPA fallback на /.

upstream minigames_api {
    server 127.0.0.1:3001;
    keepalive 8;
}

server {
    listen 443 ssl http2;
    server_name your-domain.example;

    root /var/www/minigames/client/dist;
    index index.html;

    location /api/ {
        proxy_pass http://minigames_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Telegram Mini App
        proxy_set_header X-Telegram-Init-Data $http_x_telegram_init_data;
        proxy_read_timeout 60s;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
